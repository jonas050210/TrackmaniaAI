name: CI

on:
  push:
  pull_request:
  # Manual trigger for the GPU job below. It is not scheduled: it needs a self-hosted runner
  # labelled `gpu` (see docs/TRAINING.md), and a schedule would queue forever without one.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: ruff + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy

  test:
    name: pytest (CPU, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    env:
      # Hide CUDA so the CPU suite is genuinely CPU-only (see tests/conftest.py).
      TMAI_TEST_DEVICE: cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (CPU PyTorch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - run: pytest -q

  gpu:
    name: pytest (CUDA device tests)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, gpu]
    env:
      TMAI_TEST_DEVICE: auto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (CUDA PyTorch from PyPI)
        run: pip install -e ".[dev]"
      - name: Confirm a CUDA device is visible
        run: python -c "import torch; assert torch.cuda.is_available(), 'no CUDA device'; print(torch.cuda.get_device_name(0))"
      - name: Device-dependent tests
        run: pytest -q tests/test_bc.py tests/test_device.py -rs
