driver:
  kind: simulated
  server_name: TMInterface0
  position_scale: 1.0
  forward_axis: 0
  forward_sign: 1.0
  speed_ratio: 1.0
  physics_hz: 100.0
  reset_strategy: restart
  reset_command: restart
  settle_ticks: 5
  connect_timeout_s: 20.0
  frame_timeout_s: 30.0
  allow_simulated: true
track:
  path: null
  directory: null
  pattern: '*.json'
  recursive: false
  synthetic: null
  synthetic_kwargs: {}
  synthetic_suite:
  - name: straight
    kwargs:
      length: 200.0
  - name: oval
  - name: s_curve
  - name: figure_eight
  split_weights:
    train: 0.5
    validation: 0.5
    test: 0.0
  explicit_splits: {}
multi:
  sample_tracks: true
  random_start_station: true
  start_station_fraction: 1.0
  start_lateral_std: 1.5
  start_edge_margin: 1.0
normalize:
  enabled: true
  clip: 10.0
  epsilon: 0.0001
  warmup_steps: 100
env:
  control_dt: 0.05
  action_repeat: 1
  observation:
    curvature_lookahead:
    - 5.0
    - 10.0
    - 20.0
    - 40.0
    - 80.0
    include_speed: true
    include_drivetrain: true
    include_sliding: true
    include_lateral: true
    include_heading_error: true
    include_progress_rate: true
    include_curvature: true
    include_edge_distances: true
    include_last_action: true
    include_checkpoint_progress: true
    scales:
      speed: 70.0
      lateral: 8.0
      curvature: 0.05
      yaw_rate: 2.0
      rpm: 10000.0
      gear: 6.0
      progress_delta: 3.5
  reward:
    progress_weight: 1.0
    speed_weight: 1.0
    speed_ref: 70.0
    off_track_weight: 6.0
    heading_weight: 0.4
    slip_weight: 0.4
    slide_penalty: 0.0
    step_penalty: 0.0
    idle_penalty: 0.5
    idle_speed_threshold: 1.0
    finish_bonus: 20.0
    max_speed_for_progress: 95.0
    cut_margin: 1.15
    max_backward_speed: 30.0
    off_track_margin: 0.0
    crash_penalty: 30.0
    out_of_bounds_penalty: 20.0
    fell_off_penalty: 20.0
    wrong_way_penalty: 10.0
    contact_penalty: 0.5
  termination:
    max_steps: 200
    off_track_limit: 40
    off_track_margin: 1.5
    stall_limit: 60
    min_progress_per_step: 0.05
    min_steps_before_stall: 40
    no_ground_contact_limit: 25
    crash_speed_loss: 8.0
    crash_contact_steps: 3
    crash_speed_fraction: 0.6
    min_speed_for_crash: 2.0
    out_of_bounds_margin: 6.0
    out_of_bounds_steps: 3
    fall_height: 1.5
    fall_steps: 3
    wrong_way_progress: 8.0
    wrong_way_steps: 25
  projection_window: 120.0
sac:
  gamma: 0.99
  tau: 0.005
  actor_lr: 0.0003
  critic_lr: 0.0003
  temperature_lr: 0.0003
  initial_temperature: 0.2
  learnable_temperature: true
  target_entropy: null
  max_grad_norm: 0.0
  network:
    hidden_sizes:
    - 64
    - 64
    activation: relu
    layer_norm: false
    separate_encoders: true
    dropout: 0.0
replay:
  capacity: 50000
  seed: null
train:
  total_steps: 800
  warmup_steps: 150
  batch_size: 64
  updates_per_step: 1.0
  update_every: 1
  log_interval: 100
  eval_interval: 400
  eval_episodes: 2
  held_out_eval_interval: 400
  held_out_eval_episodes: 2
  checkpoint_interval: 400
  keep_checkpoints: 3
  seed: 0
  device: null
  run_name: smoke-multitrack
  output_dir: runs
  resume: null
  max_wall_seconds: null
